<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512" fill="none">
  <defs>
    <linearGradient id="cw9-wing-left" x1="130" y1="360" x2="250" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="cw9-wing-right" x1="380" y1="360" x2="260" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="cw9-heart" x1="220" y1="160" x2="290" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <filter id="cw9-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F766E" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Icon Mark: Sheltering Hands / Origami Wings Cradling Heart Cross -->
  <g id="icon" filter="url(#cw9-shadow)">
    <!-- Left Caring Wing -->
    <path d="M140 330 C150 370 200 380 256 380 C210 330 180 280 170 210 C160 140 210 120 220 120 C180 130 130 190 130 260 C130 285 133 310 140 330 Z" fill="url(#cw9-wing-left)" />

    <!-- Right Caring Wing -->
    <path d="M372 330 C362 370 312 380 256 380 C302 330 332 280 342 210 C352 140 302 120 292 120 C332 130 382 190 382 260 C382 285 379 310 372 330 Z" fill="url(#cw9-wing-right)" />

    <!-- Sheltered Inner Cross & Heart -->
    <g transform="translate(256, 240)">
      <path d="M0 -30 C-20 -30 -35 -15 -35 5 C-35 30 0 55 0 55 C0 55 35 30 35 5 C35 -15 20 -30 0 -30 Z" fill="url(#cw9-heart)" />
      <!-- Subtle Cross cut into heart -->
      <rect x="-14" y="2" width="28" height="6" rx="2" fill="#FFFFFF" />
      <rect x="-3" y="-9" width="6" height="28" rx="2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Wordmark Text Lockup -->
  <g id="wordmark">
    <text x="440" y="278" font-family="'Inter Variable', system-ui, -apple-system, sans-serif" font-size="80" font-weight="700" letter-spacing="-0.03em" fill="#0F172A">
      Cure<tspan fill="#0D9488" font-weight="900">well</tspan>
    </text>
    <text x="444" y="324" font-family="'Inter Variable', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="0.22em" fill="#E11D48">
      PATIENT-FIRST HEALTHCARE
    </text>
  </g>
</svg>
