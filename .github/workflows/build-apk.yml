name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install React Native Mobile Dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Prebuild Standalone Native Android Project (with Widget & Alarm Receiver)
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Bundle React Native JS & Compile Standalone Release/Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Package APK to public/downloads
        run: |
          mkdir -p public/downloads
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found compiled React Native APK at: $APK_PATH"
          cp "$APK_PATH" public/downloads/Curewell.apk
          SIZE=$(stat -c%s public/downloads/Curewell.apk)
          cat <<EOF > public/downloads/status.json
          {
            "built": true,
            "engine": "React Native (Standalone Native Android + Widget + AlarmManager)",
            "appId": "com.curewell.health",
            "appName": "Curewell",
            "version": "4.0.0",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "file": "/downloads/Curewell.apk",
            "sizeBytes": $SIZE
          }
          EOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Curewell-APK
          path: public/downloads/Curewell.apk
          if-no-files-found: error
          retention-days: 30
