<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="curewell-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="curewell-accent" x1="14" y1="24" x2="34" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="curewell-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F766E" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#curewell-grad)" filter="url(#curewell-shadow)" />
  <rect x="5.5" y="5.5" width="37" height="37" rx="10.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

  <!-- Harmonious Medical Cross -->
  <path d="M24 13V35M13 24H35" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Wellness Glow & Core Point -->
  <circle cx="24" cy="24" r="3.2" fill="url(#curewell-accent)" />
  <circle cx="24" cy="24" r="1.4" fill="#0F766E" />
</svg>
